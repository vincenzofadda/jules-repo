<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Dungeon Crawler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="start-screen" class="screen">
                <h1>Dungeon Crawler</h1>
                <button id="start-btn">Start Game</button>
            </div>
            <div id="hud" class="hidden">
                <div id="player-health-bar-container">
                    <div id="player-health-bar"></div>
                    <span id="player-health-text">100/100</span>
                </div>
            </div>

            <!-- Inventory Screen (Tab) -->
            <div id="inventory-screen" class="screen hidden">
                <div class="panel">
                    <h2>Inventory</h2>
                    <div id="inventory-grid" class="grid-container">
                        <!-- Slots generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Character Screen (C) -->
            <div id="character-screen" class="screen hidden">
                <div class="panel-container">
                    <div class="panel">
                        <h2>Equipment</h2>
                        <div class="equipment-slot" data-slot="weapon">Weapon: <span id="equip-weapon">Empty</span></div>
                        <div class="equipment-slot" data-slot="armor">Armor: <span id="equip-armor">Empty</span></div>
                        <div id="stats-display">
                            <p>Damage: <span id="stat-damage">0</span></p>
                            <p>Defense: <span id="stat-defense">0</span></p>
                        </div>
                    </div>
                    <div class="panel">
                        <h2>Inventory</h2>
                        <div id="char-inventory-grid" class="grid-container">
                            <!-- Cloned/Mirrored inventory grid -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Loot Screen -->
            <div id="loot-screen" class="screen hidden">
                <div class="panel">
                    <h2>Loot</h2>
                    <div id="loot-list" class="loot-container">
                        <!-- Items -->
                    </div>
                    <button id="close-loot-btn">Close</button>
                    <button id="take-all-btn">Take All</button>
                </div>
            </div>

            <!-- Tooltip -->
            <div id="tooltip" class="hidden"></div>
        </div>
    </div>
    <script type="module" src="game.js"></script>
</body>
</html>
